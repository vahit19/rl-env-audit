[project]
name = "rl-env-audit"
version = "0.1.0"
description = "Metamorphic acceptance tests for the reward functions of RL environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }]
dependencies = []

[project.scripts]
rl-env-audit = "rl_env_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_env_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
